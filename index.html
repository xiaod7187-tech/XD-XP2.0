<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小妲的胁迫小游戏</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#020108;color:#e8dff5;
  font-family:"ZCOOL KuaiLe","Microsoft YaHei",sans-serif}
body{overflow:hidden}

/* 默认：整页横屏游戏壳 */
.stage{
  position:fixed;left:0;top:0;
  width:100vw;height:100vh;
  background:#0c0614;display:flex;flex-direction:column;overflow:hidden;
  border:3px solid #1a0e2e;outline:2px solid #c4a1ff;
}

/* 手机竖持：把页面旋成横屏，左右分栏可读 */
@media (orientation: portrait) {
  .stage{
    width:100vh;height:100vw;
    left:50%;top:50%;
    transform:translate(-50%,-50%) rotate(90deg);
    transform-origin:center center;
  }
}

.top-bar{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:4px 8px;background:#1a0e2e;border-bottom:3px solid #3a2060;flex-shrink:0;
}
h1{font-size:clamp(.8rem,2.2vh,1.1rem);color:#e8c4ff;text-shadow:2px 2px 0 #2a1048}
.sub{font-size:.6rem;color:#a78bfa}
.level-tag{font-size:.65rem;color:#f9a8d4;background:#12081c;border:2px solid #7c3aed;padding:2px 8px;white-space:nowrap}
.top-actions{display:flex;gap:6px;align-items:center}
.top-actions button{
  border:2px solid #c4a1ff;background:#2a1848;color:#e9d5ff;
  font-family:inherit;font-size:.65rem;padding:4px 8px;cursor:pointer;pointer-events:auto;
}

.game-main{display:flex;flex-direction:row;flex:1;min-height:0;min-width:0;overflow:hidden}

.canvas-col{
  flex:1.35;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:#060310;padding:4px;border-right:3px solid #3a2060;
}
#sceneCanvas{
  width:100%;flex:1;min-height:0;display:block;background:#0c0614;
  image-rendering:pixelated;image-rendering:crisp-edges;
  border:3px solid #1a0e2e;box-shadow:inset 0 0 0 2px #c4a1ff;
  pointer-events:none;
}
.hp-box{padding:4px 6px;background:#1a0e2e;border:2px solid #3a2060;margin-top:3px;flex-shrink:0}
.hp-label{display:flex;justify-content:space-between;font-size:.68rem;color:#f9a8d4;margin-bottom:2px}
.hp-bg{height:10px;background:#0a0610;border:2px solid #4a2030;overflow:hidden}
.hp-bar{height:100%;width:100%;background:repeating-linear-gradient(90deg,#ef4444 0 6px,#b91c1c 6px 8px,#f97316 8px 14px);transition:width .25s steps(10)}
.hp-bar.low{background:repeating-linear-gradient(90deg,#7f1d1d 0 6px,#dc2626 6px 12px)}
.hp-bar.dead{background:#450a0a}

.text-col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#100818;overflow:hidden}
.story{
  background:#0a0614;border:3px solid #3a2060;margin:5px;padding:8px;
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  font-size:clamp(.72rem,1.8vh,.9rem);color:#e8dff5;white-space:pre-wrap;line-height:1.5;
  pointer-events:auto;
}
.tribute-box{display:none;text-align:center;margin:0 5px 5px;padding:6px;background:#1a0e2e;border:3px solid #7c3aed;flex-shrink:0;max-height:30%;overflow-y:auto}
.tribute-box.show{display:block}
.tribute-box p{color:#c4a1ff;font-size:.7rem;margin-bottom:3px}
.tribute-box .qrs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tribute-box img{width:90px;height:90px;object-fit:contain;border:2px solid #c4a1ff;background:#fff}

.choices{padding:0 5px 8px;flex-shrink:0;max-height:42%;overflow-y:auto;-webkit-overflow-scrolling:touch;pointer-events:auto;position:relative;z-index:5}
.choices button,.menu-btn{
  display:block;width:100%;padding:10px 10px 10px 24px;margin:5px 0;
  border:3px solid #c4a1ff;background:#2a1848;color:#f5e8ff;
  font-family:inherit;font-size:clamp(.75rem,1.7vh,.9rem);
  cursor:pointer;text-align:left;box-shadow:2px 2px 0 #0a0610;border-radius:0;position:relative;
  min-height:42px;pointer-events:auto;z-index:6;-webkit-user-select:none;user-select:none;
}
.choices button::before{content:">";position:absolute;left:7px;top:50%;transform:translateY(-50%);color:#a78bfa}
.choices button:active,.menu-btn:active{background:#4a2880}
.menu-btn{padding-left:12px}
.cum-btn{display:block;width:100%;padding:10px;margin:5px 0;border:3px solid #f9a8d4;background:#9d174d;color:#fff;font-family:inherit;font-size:.88rem;min-height:42px;border-radius:0}
.cum-feedback{text-align:center;color:#fbcfe8;font-size:.72rem;margin:3px 0;border:2px solid #5b2148;padding:5px;background:#1a0a14}
.ending{text-align:center;padding:8px 4px;overflow-y:auto}
.ending h2{font-size:1.15rem;margin-bottom:6px}
.ending.win h2{color:#f0abfc}
.ending.lose h2{color:#f87171}
.form-box{text-align:left;margin-top:6px;background:#1a0a10;padding:8px;border:3px solid #7f1d1d}
.form-box label{display:block;font-size:.7rem;color:#fca5a5;margin:4px 0 2px}
.form-box input,.form-box textarea{width:100%;padding:7px;border:2px solid #7f1d1d;background:#0a0408;color:#fecaca;font-family:inherit;font-size:.8rem}
.form-box textarea{min-height:44px}
.form-box button,.reload-btn{width:100%;margin-top:6px;padding:10px;border:3px solid #c4a1ff;font-family:inherit;font-size:.85rem;cursor:pointer;color:#fff;min-height:42px;background:#2a1848}
.form-box button{background:#991b1b;border-color:#fca5a5}
.qr{max-width:100px;margin:4px auto;display:block;border:2px solid #c4a1ff;background:#fff}
.hint{font-size:.6rem;color:#9ca3af;text-align:center;margin-top:4px}
.flash-red{animation:flashRed .25s steps(2)}
@keyframes flashRed{0%,100%{filter:none}50%{filter:sepia(.4) hue-rotate(-20deg)}}
.level-clear{text-align:center;padding:10px 4px}
.level-clear h2{color:#e9d5ff;margin-bottom:4px}
.rules-list{text-align:left;font-size:.8rem;color:#e0d0f5}
.rules-list p{margin-bottom:4px}
.hidden{display:none!important}

.canvas-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#sceneCanvas{width:100%;flex:1;min-height:0}
.gif-overlay{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center;
  image-rendering:auto;pointer-events:none;z-index:2;
  background:rgba(6,3,16,0.55);
  display:none;
}
.gif-overlay.show{display:block}
.danmaku-layer{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3;
  display:none;
}
.danmaku-layer.show{display:block}
.danmaku{
  position:absolute;white-space:nowrap;
  color:#f5e8ff;font-size:clamp(.7rem,2vh,.95rem);
  text-shadow:0 0 6px #7c3aed, 1px 1px 0 #1a0a28;
  animation:danmakuMove linear forwards;
  opacity:.95;font-family:inherit;
}
@keyframes danmakuMove{
  from{transform:translateX(0);opacity:.95}
  to{transform:translateX(-120vw);opacity:.7}
}
.top-actions{display:flex;gap:6px;align-items:center}
.top-actions button{
  border:2px solid #c4a1ff;background:#2a1848;color:#e9d5ff;
  font-family:inherit;font-size:.65rem;padding:4px 8px;cursor:pointer;
  min-height:28px;pointer-events:auto;
}
.top-actions button.on{background:#6d28d9;border-color:#e9d5ff;color:#fff}

</style>
</head>
<body>
  <div class="stage" id="wrap">
    <div class="top-bar">
      <div>
        <h1>校园模拟胁迫</h1>
        <p class="sub">小妲学姐 · 横屏像素</p>
      </div>
      <div class="top-actions">
        <button type="button" id="btnGif" title="动图/飘字">动图 关</button>
        <div class="level-tag" id="levelTag">开始前</div>
      </div>
    </div>
    <div class="game-main">
      <div class="canvas-col">
        <div class="canvas-wrap">
          <canvas id="sceneCanvas" width="1280" height="720"></canvas>
          <img id="gifOverlay" class="gif-overlay" alt="" />
          <div id="danmakuLayer" class="danmaku-layer"></div>
        </div>
        <div class="hp-box" id="hpBox">
          <div class="hp-label"><span>精神值</span><span id="hpText">150 / 150</span></div>
          <div class="hp-bg"><div class="hp-bar" id="hpBar"></div></div>
        </div>
      </div>
      <div class="text-col">
        <div class="story" id="story"></div>
        <div class="tribute-box" id="tributeBox">
          <p>扫码上贡 · 支付宝 / 微信</p>
          <div class="qrs">
            <div>
              <p style="font-size:0.7rem;margin-bottom:3px;">支付宝</p>
              <img src="https://i.postimg.cc/SNh3sQBR/IMG-20260721-005325.jpg" alt="支付宝">
            </div>
            <div>
              <p style="font-size:0.7rem;margin-bottom:3px;">微信</p>
              <img src="https://i.postimg.cc/ht4YLyP8/IMG-20260721-005339.png" alt="微信">
            </div>
          </div>
        </div>
        <div class="choices" id="choices"></div>
      </div>
    </div>
  </div>
<script>
    let hp = 150;
    const maxHp = 150;
    let pendingNext = null;
    let animFrame = 0;
    let animId = null;
    let currentVisual = { bg: "dark", pose: "none", prop: "none", motion: "idle" };
    let cumParticles = []; // {x,y,vx,vy,life,size}
    let cumFlash = 0;
    let lastSceneKey = "";
    let cumAllowed = false; // 当前场景是否可点射精

    const levelNames = {
      0: "开始前",
      1: "第一关 · 放学走廊",
      2: "第二关 · 课堂与厕所",
      3: "第三关 · 周末公园"
    };

    const visuals = {
      boot:   { bg: "dark", pose: "none", prop: "none", motion: "idle" },
      rules:  { bg: "dark", pose: "none", prop: "none", motion: "idle" },
      l1_1:   { bg: "corridor", pose: "stand", prop: "phone", motion: "breathe" },
      l1_2:   { bg: "corridor", pose: "kneel", prop: "none", motion: "tremble" },
      l1_3:   { bg: "corridor", pose: "crawl", prop: "none", motion: "tremble" },
      l1_4:   { bg: "corridor", pose: "crawl", prop: "shoe", motion: "shake" },
      l1_5:   { bg: "corridor", pose: "crawl", prop: "none", motion: "crawl" },
      l1_6:   { bg: "corridor", pose: "crawl", prop: "shoe", motion: "stroke" },
      l1_7:   { bg: "corridor", pose: "crawl", prop: "shoe", motion: "tremble" },
      l1_8:   { bg: "corridor", pose: "collapse", prop: "none", motion: "kick" },
      l1_9:   { bg: "corridor", pose: "kneel", prop: "qr", motion: "tremble", tribute: true },
      l1_10:  { bg: "corridor", pose: "kneel", prop: "shoe", motion: "stroke" },
      clear1: { bg: "corridor", pose: "kneel", prop: "none", motion: "breathe" },
      l2_1:   { bg: "classroom", pose: "stand", prop: "none", motion: "breathe" },
      l2_2:   { bg: "classroom", pose: "sit", prop: "none", motion: "stroke" },
      l2_2b:  { bg: "classroom", pose: "sit", prop: "none", motion: "shake" },
      l2_3:   { bg: "stall", pose: "stand", prop: "phone", motion: "tremble" },
      l2_4:   { bg: "stall", pose: "stand", prop: "phone", motion: "breathe" },
      l2_5:   { bg: "stall", pose: "sit", prop: "qr", motion: "tremble", tribute: true },
      l2_6:   { bg: "stall", pose: "alone", prop: "none", motion: "breathe" },
      clear2: { bg: "stall", pose: "alone", prop: "none", motion: "breathe" },
      l3_1:   { bg: "room", pose: "stand", prop: "water", motion: "breathe" },
      l3_2:   { bg: "park", pose: "stand", prop: "leash", motion: "breathe" },
      l3_3:   { bg: "park", pose: "crawl", prop: "leash", motion: "crawl" },
      l3_4:   { bg: "park", pose: "crawl", prop: "leash", motion: "tremble" },
      l3_5:   { bg: "park", pose: "kneel", prop: "leash", motion: "tremble" },
      l3_6:   { bg: "park", pose: "collapse", prop: "leash", motion: "kick" },
      l3_7:   { bg: "park", pose: "kneel", prop: "qr", motion: "tremble", tribute: true },
      l3_8:   { bg: "park", pose: "alone", prop: "leash", motion: "stroke" },
      end:    { bg: "park", pose: "alone", prop: "none", motion: "breathe" }
    };

    const cv = document.getElementById("sceneCanvas");
    const ctx = cv.getContext("2d");
    const W = 320, H = 180;
    const off = document.createElement("canvas");
    off.width = W; off.height = H;
    const octx = off.getContext("2d");
    function p(x, y, w, h, c) {
      octx.fillStyle = c;
      octx.fillRect(x | 0, y | 0, w | 0, h | 0);
    }
    function beginFrame() {
      octx.setTransform(1, 0, 0, 1, 0, 0);
      octx.imageSmoothingEnabled = false;
      octx.clearRect(0, 0, W, H);
    }
    function endFrame() {
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.drawImage(off, 0, 0, cv.width, cv.height);
    }


    function t() { return animFrame; }
    function bob(amp, spd) { return Math.sin(t() * spd) * amp; }
    // 放慢帧切换，动作更清晰可辨
    function step() { return Math.floor(t() / 18) % 2; }
    function step3() { return Math.floor(t() / 16) % 3; }
    function hasCollar() {
      return currentVisual.prop === "leash";
    }

    function drawCorridor() {
      p(0, 0, 320, 180, "#0c0516");
      // 天花
      p(0, 0, 320, 20, "#1a0e28");
      for (let i = 0; i < 20; i++) p(i * 16, 0, 14, 3, "#241838");
      for (let i = 0; i < 20; i++) p(i * 16, 6, 14, 2, "#1e1430");
      for (let i = 0; i < 20; i++) p(i * 16, 12, 14, 2, "#1a1028");
      // 灯管
      for (const lx of [40, 130, 220]) {
        p(lx, 2, 44, 7, "#e9d5ff");
        p(lx + 2, 3, 40, 5, "#f5e8ff");
        p(lx + 4, 4, 36, 3, "#ffffff");
        p(lx + 6, 10, 32, 3, "rgba(232,200,255,0.25)");
        p(lx + 10, 14, 24, 4, "rgba(200,160,255,0.1)");
      }
      // 墙
      p(0, 20, 40, 100, "#1a0e28");
      p(280, 20, 40, 100, "#1a0e28");
      p(38, 20, 3, 100, "#3a2860");
      p(279, 20, 3, 100, "#3a2860");
      // 墙砖缝
      for (let r = 0; r < 8; r++) {
        p(0, 22 + r * 12, 38, 1, "#12081c");
        p(282, 22 + r * 12, 38, 1, "#12081c");
      }
      // 储物柜
      for (let side = 0; side < 2; side++) {
        const bx = side ? 282 : 2;
        for (let i = 0; i < 5; i++) {
          const ly = 22 + i * 18;
          p(bx, ly, 34, 16, "#3a2858");
          p(bx + 1, ly + 1, 32, 2, "#5a4080");
          p(bx + 1, ly + 14, 32, 1, "#2a1840");
          p(bx + 2, ly + 4, 12, 8, "#2a1838");
          p(bx + 3, ly + 5, 10, 6, "#1e1030");
          p(bx + 4, ly + 6, 3, 3, "#3a2860");
          p(bx + 24, ly + 5, 6, 6, "#c4a1ff");
          p(bx + 25, ly + 6, 4, 4, "#e9d5ff");
          p(bx + 26, ly + 7, 2, 2, "#ffffff");
        }
      }
      // 地板
      p(0, 120, 320, 60, "#1a142c");
      for (let r = 0; r < 5; r++)
        for (let c = 0; c < 16; c++) {
          const col = ((r + c) % 2 === 0) ? "#2a1e3c" : "#221832";
          p(c * 20, 122 + r * 11, 18, 9, col);
        }
      for (let c = 0; c < 17; c++) p(c * 20, 120, 1, 60, "#12081c");
      // 门
      p(138, 32, 44, 88, "#1a0f28");
      p(142, 36, 36, 80, "#120a1c");
      p(144, 40, 32, 4, "#2a1840");
      p(144, 50, 32, 2, "#1e1030");
      p(166, 70, 5, 10, "#a78bfa");
      p(167, 72, 3, 6, "#e9d5ff");
      // 海报
      p(44, 48, 16, 22, "#2a1848");
      p(46, 50, 12, 8, "#5a3080");
      p(46, 60, 12, 8, "#3a2060");
      p(260, 50, 16, 20, "#2a1848");
      p(262, 52, 12, 7, "#4a3080");
      p(262, 61, 12, 7, "#3a2060");
    }

    function drawClassroom() {
      p(0, 0, 320, 180, "#0e0a20");
      p(0, 0, 320, 16, "#181430");
      for (let i = 0; i < 20; i++) p(i * 16, 2, 14, 2, "#241e3a");
      // 黑板
      p(28, 14, 264, 60, "#0a1c16");
      p(32, 18, 256, 52, "#0f2a22");
      p(36, 22, 248, 44, "#163830");
      p(40, 26, 70, 3, "#c4a1ff");
      p(40, 32, 100, 2, "#88aa99");
      p(40, 38, 80, 2, "#88aa99");
      p(40, 44, 50, 2, "#6a8878");
      p(40, 50, 90, 2, "#5a7868");
      p(32, 70, 256, 4, "#3a3050");
      p(36, 71, 10, 2, "#e8e0f0");
      p(50, 71, 8, 2, "#c4a1ff");
      // 窗
      for (const wx of [0, 292]) {
        p(wx, 20, 28, 60, "#0a1428");
        p(wx + 2, 22, 11, 26, "#1a3050");
        p(wx + 15, 22, 11, 26, "#1a3050");
        p(wx + 2, 50, 11, 26, "#152848");
        p(wx + 15, 50, 11, 26, "#152848");
        p(wx + 4, 24, 6, 6, "#3b82f6");
      }
      // 地
      p(0, 128, 320, 52, "#1a1430");
      for (let c = 0; c < 16; c++) p(c * 20, 128, 18, 2, "#2a2040");
      for (let c = 0; c < 16; c++) p(c * 20, 150, 18, 2, "#241c38");
      // 课桌
      for (let r = 0; r < 2; r++)
        for (let c = 0; c < 4; c++) {
          const dx = 22 + c * 74, dy = 98 + r * 30;
          p(dx, dy, 62, 8, "#4a3870");
          p(dx + 1, dy + 1, 60, 2, "#6a5090");
          p(dx + 2, dy + 8, 58, 3, "#3a2858");
          p(dx + 6, dy + 11, 6, 14, "#2e2048");
          p(dx + 50, dy + 11, 6, 14, "#2e2048");
          p(dx + 16, dy - 4, 22, 5, "#e8e0f0");
          p(dx + 18, dy - 3, 10, 2, "#c4b8d8");
          p(dx + 42, dy - 2, 5, 4, "#3b82f6");
        }
    }

    function drawStall() {
      p(0, 0, 320, 180, "#080510");
      p(36, 4, 248, 172, "#141028");
      for (let i = 0; i < 14; i++) {
        p(38, 8 + i * 12, 5, 10, "#100c1c");
        p(277, 8 + i * 12, 5, 10, "#100c1c");
      }
      p(36, 4, 14, 172, "#0e0a18");
      p(270, 4, 14, 172, "#0e0a18");
      p(50, 14, 5, 150, "#06040c");
      p(50, 36, 3, 8, "#5a4080");
      p(50, 100, 3, 8, "#5a4080");
      p(51, 38, 1, 4, "#c4a1ff");
      p(50, 152, 220, 24, "#1a1428");
      for (let i = 0; i < 10; i++) p(56 + i * 22, 156, 18, 3, "#221a35");
      p(120, 6, 80, 6, "#4a3860");
      p(130, 8, 60, 4, "#7a6090");
      p(140, 12, 40, 3, "rgba(180,140,220,0.2)");
      p(200, 40, 28, 3, "#3a2850");
      p(205, 48, 18, 2, "#3a2850");
      p(70, 55, 3, 24, "#2a1838");
      p(72, 70, 20, 2, "#2a1838");
    }

    function drawPark() {
      p(0, 0, 320, 180, "#05040c");
      p(0, 0, 320, 55, "#080610");
      for (let i = 0; i < 24; i++) {
        p((i * 37 + 8) % 310, 3 + (i * 11) % 45, 2, 2, "#c4b8e0");
        if (i % 4 === 0) p((i * 53) % 300, 6 + (i * 7) % 40, 3, 3, "#e8e0f8");
      }
      p(255, 10, 20, 20, "#e8e0f8");
      p(260, 8, 12, 8, "#d0c8e8");
      p(262, 14, 8, 8, "#f5f0ff");
      p(0, 125, 320, 55, "#101018");
      for (let i = 0; i < 20; i++) p(i * 16, 125, 14, 2, "#1a1820");
      p(40, 128, 240, 40, "#181624");
      for (let i = 0; i < 12; i++) p(48 + i * 18, 130, 14, 2, "#221e30");
      function tree(tx, ty) {
        p(tx, ty + 22, 14, 72, "#1a2030");
        p(tx + 3, ty + 22, 5, 72, "#243040");
        p(tx - 16, ty, 46, 30, "#0c1c10");
        p(tx - 12, ty - 10, 38, 22, "#142818");

    function updateGifOverlay(key) {

      if (!img) return;
      const src = gifMap[key];
      const hasDanmaku = !!(danmakuPool[key] && danmakuPool[key].length);
      currentGifKey = src ? key : null;

      // 动图总开关关闭：全部关掉
      if (!gifEnabled) {
        img.classList.remove("show");
        img.removeAttribute("src");
        stopDanmaku();
        return;
      }

      // 有对应动图：显示动图
      if (src) {
        img.src = src;
        img.classList.add("show");
      } else {
        img.classList.remove("show");
        img.removeAttribute("src");
      }

      // 有飘字池（含上贡节点）：即使没有动图也飘

        choices.innerHTML =
          '<div class="ending win"><h2>通关成功</h2>' +
          "<p>三关全部结束。<br>精神值剩余 <b>" + Math.round(hp) + "</b>。</p>" +
          '<p style="margin-top:10px;color:#e9d5ff;">走廊、教室、公园。<br>你已经彻底成为小妲学姐的狗。<br>没有任何翻身的机会。</p>' +
          '<p style="margin-top:12px;color:#c4a1ff;">可扫码上贡</p>' +
          '<img class="qr" src="https://i.postimg.cc/SNh3sQBR/IMG-20260721-005325.jpg" alt="支付宝">' +
          '<img class="qr" src="https://i.postimg.cc/ht4YLyP8/IMG-20260721-005339.png" alt="微信">' +
          '<button class="reload-btn" type="button" onclick="location.reload()">再玩一次</button>' +
          '<p class="hint">虚构角色扮演 · 请理性自愿参与</p></div>';
      } else {
        choices.innerHTML =
          '<div class="ending lose"><h2>败北</h2>' +
          "<p>精神值归零，你在胁迫中崩溃。</p>" +
          '<p style="margin-top:8px;color:#fca5a5;">「连狗都当不好。把奴籍填了。」</p>' +
          '<div class="form-box">' +
          '<p style="color:#fecaca;font-size:0.76rem;">※ 认真填写。</p>' +
          "<label>狗名 / 奴名（化名）</label>" +
          '<input id="dogName" placeholder="例如：废物一号" maxlength="20">' +
          "<label>认罪告白</label>" +
          '<textarea id="confess" placeholder="剧情里的认输…" maxlength="200"></textarea>' +
          "<label>上贡承诺</label>" +
          '<input id="payPromise" placeholder="例如：每周 xx" maxlength="30">' +
          '<button type="button" id="btnSubmitLose">提交奴籍</button></div></div>';
        document.getElementById("btnSubmitLose").onclick = submitLose;
      }
    }

    function submitLose() {
      const name = (document.getElementById("dogName").value || "").trim() || "无名狗";
      const conf = (document.getElementById("confess").value || "").trim() || "……";
      document.getElementById("choices").innerHTML =
        '<div class="ending lose"><h2>奴籍已登记</h2>' +
        '<p style="color:#fecaca;">「' + name + "」已记入小妲学姐名下。</p>" +
        '<p style="margin-top:8px;font-size:0.84rem;color:#fca5a5;">「' + conf + "」</p>" +
        '<p style="margin-top:12px;color:#c4a1ff;">败北者仍可扫码上贡</p>' +
        '<img class="qr" src="https://i.postimg.cc/SNh3sQBR/IMG-20260721-005325.jpg" alt="支付宝">' +
        '<img class="qr" src="https://i.postimg.cc/ht4YLyP8/IMG-20260721-005339.png" alt="微信">' +
        '<button class="reload-btn" type="button" onclick="location.reload()">再玩一次</button>' +
        '<p class="hint">角色扮演 · 理性参与</p></div>';
    }

    updateHp();
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(function () {});
      }
    } catch (e) {}
    
    showDisclaimer();
  </script>
</body>
</html>
